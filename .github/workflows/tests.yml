name: Python acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev-lock.txt
      - run: python -m mypy --config-file mypy.ini
      - run: python -m pytest tests -q --cov=services --cov=repository --cov=config --cov-fail-under=80 --cov-report=term --cov-report=xml:coverage.xml
      - run: python -m compileall -q app.py config.py repository.py services views scripts
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qianpin-ci .
      - run: docker run --rm qianpin-ci python -m pytest tests/test_access.py tests/test_migrations.py tests/test_units.py -q
      - name: Check protected container health
        run: |
          docker run -d --name qianpin-smoke -p 127.0.0.1:18501:8501 -e QIANPIN_AUTH_REQUIRED=true qianpin-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18501/_stcore/health; then exit 0; fi
            sleep 1
          done
          docker logs qianpin-smoke
          exit 1
      - if: always()
        run: docker rm -f qianpin-smoke || true
